name: Validate
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run validate
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme TabIcons -destination 'platform=macOS' -derivedDataPath /tmp/cxl-icons-macos test
      - run: xcodebuild -scheme TabIcons -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/cxl-icons-ios CODE_SIGNING_ALLOWED=NO build
      - run: swift scripts/icons/render-sheet.swift icons /tmp/tab-icons-preview.png --size 16 --scale 2
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [packages, swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Package release
        id: package
        run: node scripts/prepare-release.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: bash scripts/publish-release.sh
